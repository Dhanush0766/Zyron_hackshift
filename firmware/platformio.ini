; MedGate ESP32 firmware.
; NOT compiled for ESP32 in the development environment (toolchain download was
; blocked by network policy). First build on your machine: `pio run -e esp32dev`.
; espressif32 6.9.0 ships Arduino-ESP32 core 2.0.x (ledcSetup/ledcAttachPin API).
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -Wall
lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  bogde/HX711@^0.7.5
  adafruit/RTClib@^2.1.4
  adafruit/Adafruit SSD1306@^2.5.10
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit PWM Servo Driver Library@^3.0.2
  adafruit/Adafruit AHTX0@^2.0.5
  bblanchon/ArduinoJson@^7.0.4
  miguelbalboa/MFRC522@^1.4.11
