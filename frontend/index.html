<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="MedGate — Health-Gated Dispensing Dashboard. Closed-loop medication management prototype.">
<title>MedGate — Health-Gated Dispenser</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<!-- Sidebar navigation -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <svg class="sidebar-logo" width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect x="2" y="2" width="32" height="32" rx="10" fill="var(--primary)"/><path d="M11 18h14M18 11v14" stroke="var(--on-primary)" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="sidebar-brand-text">
      <strong>MedGate</strong>
      <span>health-gated dispensing</span>
    </div>
  </div>
  <nav id="nav" aria-label="Main navigation"></nav>
  <div class="sidebar-footer-note">Prototype · dummy tablets · IDF-B example thresholds, not clinical guidance</div>
  <button class="sidebar-collapse-btn" id="sidebarToggle" aria-label="Collapse sidebar">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M13 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
</aside>

<!-- Main content area -->
<div class="main-wrapper" id="mainWrapper">
  <!-- Top bar -->
  <header class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="topbar-menu-btn" id="menuBtn" aria-label="Open navigation">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 6h16M3 11h16M3 16h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <h1 class="topbar-title" id="pageTitle">Overview</h1>
    </div>
    <div class="topbar-right">
      <div class="topbar-status" id="conn">
        <span class="status-dot" id="statusDot"></span>
        <span id="connText">connecting…</span>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M9 1v2M9 15v2M1 9h2M15 9h2M3.3 3.3l1.4 1.4M13.3 13.3l1.4 1.4M3.3 14.7l1.4-1.4M13.3 4.7l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M15.1 10.4A7 7 0 017.6 2.9a7 7 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <!-- Page content -->
  <main id="view"></main>
</div>

<!-- Dose detail drawer -->
<div class="drawer-overlay" id="drawerOverlay" hidden></div>
<aside id="drawer" class="drawer" hidden></aside>

<!-- Toast container -->
<div class="toast-container" id="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
